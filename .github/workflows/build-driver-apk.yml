name: Build SiteSeva Driver APK
on:
  workflow_dispatch:
  push:
    branches: [driver-android-preview]
    paths:
      - "android-driver-app/**"
      - ".github/workflows/build-driver-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: android-driver-app
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteSeva-Driver-Preview-APK
          path: android-driver-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
